apiVersion: apps/v1
kind: Deployment
metadata:
  name: pughcv
  namespace: pughcv
  labels:
    app.kubernetes.io/name: pughcv
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: pughcv
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pughcv
    spec:
      # Tectonic compiles can run up to 60s; let in-flight PDFs finish.
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          # Bump this tag on every build so the rollout is unambiguous.
          image: pughcv:0.1.0
          # k3d image import puts the image straight in containerd; there is no
          # registry to pull from, so never try.
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - secretRef:
                name: pughcv-secrets
          volumeMounts:
            # The PDF route mkdtemp()s under os.tmpdir() per request.
            # Do NOT mount over /app/.cache — the Tectonic bundle is primed
            # there at build time and shadowing it forces runtime downloads.
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 2
            failureThreshold: 45
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi
