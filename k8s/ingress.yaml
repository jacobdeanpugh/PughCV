# Exposes the app on your tailnet as https://pughcv.<your-tailnet>.ts.net
# The Tailscale operator issues the cert and MagicDNS name from spec.tls.hosts.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pughcv
  namespace: pughcv
  annotations:
    # Uncomment to also publish on the public internet via Tailscale Funnel.
    # tailscale.com/funnel: "true"
    tailscale.com/hostname: pughcv
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: pughcv
      port:
        number: 80
  tls:
    - hosts:
        - pughcv
